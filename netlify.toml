[build]
  publish = "."
  command = "python3 build.py"

# Netlify serves 404.html automatically for unmatched paths — no redirect rule needed.

# www -> kale domein (werkt zodra boldframe.nl aan deze site is gekoppeld)
[[redirects]]
  from = "https://www.boldframe.nl/*"
  to = "https://boldframe.nl/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
